# Tells Prometheus to scrape every shop service's /metrics every 15s.
# Prometheus adds `service`, `namespace`, `pod` labels to every series.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: shop
  labels:
    app.kubernetes.io/part-of: shop
spec:
  namespaceSelector:
    matchNames: [shop]
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shop
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
